- insert:
    - id: safe-autoupdate
      name: dsh-safe-autoupdate
      config:
        enabled: true
        autoCheck: true
        autoApply: true
        autoRestart: true
        channel: latest
        startupDelayMs: 30000
        checkIntervalMs: 21600000
        checkTimeoutMs: 30000
        installTimeoutMs: 600000
        restartDelayMs: 120000
        shutdownTimeoutMs: 60000
        registry: ""
        logToConsole: true
